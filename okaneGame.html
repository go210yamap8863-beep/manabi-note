<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ツリーマネー">
<meta name="robots" content="noindex,nofollow">
<title>ツリーマネー・アドベンチャー</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Zen Maru Gothic','Hiragino Maru Gothic Pro',sans-serif;background:#fff8f5;color:#444;min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:40px;}
.hdr{background:linear-gradient(135deg,#34d399,#10b981 60%,#f59e0b);padding:20px 18px 16px;position:relative;overflow:hidden;color:#fff;}
.hdr::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12);}
.hdr-title{font-weight:700;font-size:18px;}
.hdr-sub{font-size:11px;opacity:.9;margin-top:2px;}
.content{padding:14px 16px 0;}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 3px 14px rgba(0,0,0,.07);margin-bottom:14px;}
.sec-title{font-weight:700;font-size:15px;margin-bottom:10px;}
.lbl{font-size:12px;color:#999;}
.btn{width:100%;padding:14px;border:none;border-radius:16px;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit;color:#fff;background:linear-gradient(135deg,#10b981,#34d399);box-shadow:0 4px 16px rgba(16,185,129,.3);}
.btn.pink{background:linear-gradient(135deg,#ff8c61,#ff6b9d);box-shadow:0 4px 16px rgba(255,107,157,.3);}
.btn.gray{background:#f1f1f1;color:#888;box-shadow:none;}
.btn:disabled{opacity:.4;cursor:default;}
.btn+.btn{margin-top:10px;}
.menu-btn{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:2px solid #eef7f2;border-radius:18px;background:#fff;cursor:pointer;font-family:inherit;text-align:left;margin-bottom:10px;}
.menu-btn .ic{font-size:34px;}
.menu-btn b{display:block;font-size:15px;color:#333;}
.menu-btn small{font-size:11px;color:#999;}
.inp{width:100%;border:2px solid #d1fae5;border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit;outline:none;color:#555;}
.chars{display:flex;gap:8px;margin-top:8px;}
.char{flex:1;font-size:30px;padding:8px 0;border:2px solid #eee;border-radius:14px;background:#fff;cursor:pointer;}
.char.sel{border-color:#10b981;background:#ecfdf5;}
/* status bar */
.stat-row{display:flex;gap:8px;}
.stat{flex:1;background:#fff;border-radius:16px;padding:10px 6px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.stat .e{font-size:20px;}
.stat .v{font-weight:700;font-size:14px;color:#333;margin-top:2px;}
.stat .n{font-size:10px;color:#aaa;}
/* tree */
.tree-box{text-align:center;padding:6px 0 0;}
.tree{font-size:72px;line-height:1;display:inline-block;transition:transform .4s;}
.tree.grow{animation:grow .8s ease;}
@keyframes grow{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.tree.shake{animation:shake .6s ease;}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.age-badge{display:inline-block;background:#ecfdf5;color:#059669;font-weight:700;border-radius:20px;padding:4px 12px;font-size:12px;}
.progress{height:8px;background:#f1f5f9;border-radius:6px;overflow:hidden;margin-top:8px;}
.progress>div{height:100%;background:linear-gradient(90deg,#34d399,#f59e0b);transition:width .4s;}
/* allocation */
.alloc{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f5f5f5;}
.alloc:last-of-type{border-bottom:none;}
.alloc .ic{font-size:28px;width:36px;text-align:center;}
.alloc .t{flex:1;}
.alloc .t b{font-size:14px;}
.alloc .t small{display:block;font-size:10px;color:#aaa;line-height:1.4;}
.stepper{display:flex;align-items:center;gap:6px;}
.stepper button{width:34px;height:34px;border-radius:50%;border:none;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit;background:#f1f5f9;color:#555;}
.stepper .amt{min-width:58px;text-align:center;font-weight:700;font-size:14px;}
.remain{text-align:center;font-size:13px;margin:10px 0;font-weight:700;}
/* event card */
.event{border:3px dashed #fcd34d;background:#fffbeb;}
.event .big{font-size:44px;text-align:center;}
.choice{display:block;width:100%;padding:13px;border-radius:14px;border:2px solid #e5e7eb;background:#fff;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px;color:#444;text-align:left;}
.lesson{background:#eff6ff;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.7;color:#1e3a8a;margin-top:12px;}
.lesson b{color:#1d4ed8;}
.result-line{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid #f5f5f5;}
.up{color:#059669;font-weight:700;}
.down{color:#dc2626;font-weight:700;}
.market{font-size:40px;text-align:center;font-weight:700;margin:6px 0;}
/* quiz */
.q-num{font-size:12px;color:#aaa;}
.q-text{font-size:16px;font-weight:700;line-height:1.6;margin:8px 0 6px;}
.choice.ok{border-color:#10b981;background:#ecfdf5;}
.choice.ng{border-color:#f87171;background:#fef2f2;}
/* misc */
.center{text-align:center;}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px;}
.bdg{background:#fff7ed;border:2px solid #fed7aa;border-radius:14px;padding:6px 10px;font-size:12px;font-weight:700;color:#c2410c;}
.p-text{font-size:13px;line-height:1.8;color:#555;}
.p-text h3{font-size:14px;margin:14px 0 4px;color:#059669;}
.p-text li{margin-left:18px;}
.small{font-size:11px;color:#aaa;line-height:1.6;}
.confetti{position:fixed;width:9px;height:9px;pointer-events:none;z-index:999;animation:cf 2s ease-in forwards;}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}
.back{background:rgba(255,255,255,.25);border:none;color:#fff;border-radius:12px;padding:5px 10px;font-family:inherit;font-size:12px;cursor:pointer;position:absolute;right:14px;top:18px;z-index:2;}
/* ===== すごろく ===== */
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;}
.sq{aspect-ratio:1;border-radius:10px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;line-height:1.1;}
.sq small{font-size:8px;color:#666;margin-top:2px;white-space:nowrap;}
.sq .tk{position:absolute;bottom:-4px;left:0;right:0;text-align:center;font-size:15px;letter-spacing:-4px;}
.sq.cur{box-shadow:0 0 0 3px #f59e0b;z-index:1;}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.pc{background:#fff;border-radius:14px;padding:8px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:2px solid transparent;line-height:1.6;}
.pc.on{border-color:#f59e0b;background:#fffbeb;}
.pc.done{opacity:.6;}
.pc b{font-size:13px;}
.dice{display:inline-flex;align-items:center;justify-content:center;width:76px;height:76px;border-radius:18px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12);font-size:40px;font-weight:700;color:#ff6b9d;margin:10px 0;}
.dice.roll{animation:dr .12s linear infinite;}
@keyframes dr{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}100%{transform:rotate(-12deg)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:800;display:flex;align-items:center;justify-content:center;padding:18px;}
.modal{background:#fff;border-radius:24px;padding:20px;width:100%;max-width:400px;max-height:88vh;overflow-y:auto;animation:mpop .25s ease;}
@keyframes mpop{from{transform:scale(.85);opacity:0}}
.modal .big{font-size:48px;text-align:center;}
.modal .ttl{font-weight:700;font-size:16px;text-align:center;margin:4px 0 8px;}
.modal .who{text-align:center;font-size:12px;color:#999;}
.choice:disabled{opacity:.5;}
.fly{position:fixed;top:12%;left:50%;transform:translateX(-50%);z-index:900;font-weight:700;font-size:20px;color:#059669;background:#fff;border-radius:16px;padding:8px 16px;box-shadow:0 6px 20px rgba(0,0,0,.15);pointer-events:none;white-space:nowrap;animation:fly 2.2s ease forwards;}
@keyframes fly{0%{opacity:0;transform:translateX(-50%) translateY(20px)}20%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-40px)}}
.ptable{width:100%;font-size:13px;border-collapse:collapse;margin-top:8px;}
.ptable td{padding:5px 2px;border-bottom:1px solid #f3f3f3;}
.ptable td:last-child{text-align:right;}
.prow{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.prow .char{flex:none;width:48px;font-size:26px;padding:4px 0;}
.cnt{display:flex;gap:6px;}
.cnt button{flex:1;padding:10px;border-radius:12px;border:2px solid #eee;background:#fff;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;color:#888;}
.cnt button.sel{border-color:#ff6b9d;background:#fff0f6;color:#ff6b9d;}
.rank{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #f3f3f3;}
.rank:last-child{border-bottom:none;}
.rank .m{font-size:30px;}
.rank .tot{font-weight:700;font-size:18px;color:#d97706;}
.new{background:#ff6b9d;color:#fff;border-radius:8px;font-size:10px;padding:1px 6px;margin-left:4px;vertical-align:middle;}

.sq .no{position:absolute;top:1px;left:4px;font-size:8px;color:#888;font-style:normal;font-weight:700;}
.sq .ar{position:absolute;font-size:9px;color:#64748b;font-style:normal;line-height:1;}
.sq .arr{right:-5px;top:50%;transform:translateY(-50%);z-index:2;}
.sq .arl{left:-5px;top:50%;transform:translateY(-50%);z-index:2;}
.sq .ard{bottom:-6px;left:50%;transform:translateX(-50%);z-index:2;}
.sq.stop{box-shadow:inset 0 0 0 2px #fb923c;}
.sq.cur{box-shadow:0 0 0 3px #f59e0b;}
.pc .pl{display:inline-block;min-width:66px;color:#888;font-size:11px;}
.sg-help{border:none;background:#eff6ff;color:#2563eb;border-radius:10px;padding:2px 8px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;margin-left:4px;}
.sg-log{font-size:12px;color:#666;background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:110px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.sg-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:#fff;border-top:2px solid #fde68a;padding:10px 14px max(10px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:50;box-shadow:0 -4px 16px rgba(0,0,0,.08);}
.sg-bar .dice{width:64px;height:64px;font-size:34px;margin:0;flex:none;}
.sg-who{flex:1;display:flex;flex-direction:column;gap:4px;}
.sg-who b{font-size:15px;}
.sg-who small{font-size:11px;color:#999;}
.sg-roll{padding:10px;font-size:15px;}
.sg-roll.go{animation:opbeat2 1s ease-in-out infinite;}
.sg-split{margin:10px 0 6px;padding:8px;background:#f0fdf4;border-radius:12px;font-weight:700;font-size:13px;}
.sg-legend{text-align:left;line-height:2;font-size:13px;}

.sg3d{height:min(58vh,440px);border-radius:14px;overflow:hidden;position:relative;background:#bfe9ff;}
.sg3d canvas{display:block;width:100%!important;height:100%!important;}
.sg-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;margin-bottom:8px;gap:6px;}
.sq .ar{font-size:10px;color:#fff;background:#f97316;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.sq .arr{right:-9px;} .sq .arl{left:-9px;} .sq .ard{bottom:-9px;}
/* ===== おかねの がっこう ===== */
.sc-path{position:relative;padding:4px 0 10px;}
.sc-node{display:flex;align-items:center;gap:12px;width:calc(100% - 70px);padding:12px 14px;margin-bottom:10px;border:3px solid #e0e7ff;border-radius:22px;background:#fff;font-family:inherit;text-align:left;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.05);}
.sc-node .sc-ic{font-size:32px;width:44px;height:44px;border-radius:50%;background:#eff6ff;display:flex;align-items:center;justify-content:center;flex:none;}
.sc-node .sc-tx{display:flex;flex-direction:column;line-height:1.35;}
.sc-node .sc-tx b{font-size:15px;color:#333;}
.sc-node .sc-tx small{font-size:11px;color:#999;}
.sc-node.done{border-color:#fcd34d;background:#fffbeb;}
.sc-node.done .sc-ic{background:#fef3c7;}
.sc-node.cur{border-color:#34d399;animation:scpulse 1.6s ease-in-out infinite;}
@keyframes scpulse{50%{box-shadow:0 0 0 6px rgba(52,211,153,.25);}}
.sc-node.lock{opacity:.5;cursor:default;background:#f8fafc;}
.sc-ill{font-size:64px;text-align:center;margin:14px 0 6px;letter-spacing:4px;}
.sc-st{font-weight:700;font-size:18px;text-align:center;color:#1d4ed8;margin-bottom:8px;}
.sc-b{font-size:15px;line-height:1.9;background:#f8fafc;border-radius:14px;padding:12px 14px;}
.sc-b b{color:#d97706;}
.sc-dots{display:flex;justify-content:center;gap:6px;margin-top:12px;}
.sc-dots i{width:8px;height:8px;border-radius:50%;background:#e5e7eb;}
.sc-dots i.on{background:#10b981;width:20px;border-radius:4px;}
.sc-bub{background:#fff7ed;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.7;margin:8px 0;}
.sc-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f3f3f3;}
.sc-mini{padding:7px 10px;border-radius:12px;border:2px solid #e5e7eb;background:#fff;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;color:#555;}
.sc-mini.ok{border-color:#10b981;background:#ecfdf5;color:#059669;}
.sc-mini.ng{border-color:#f87171;background:#fef2f2;color:#dc2626;}
.sc-big{text-align:center;font-size:22px;margin-top:12px;}
.sc-big b{color:#d97706;font-size:30px;}
.sc-coins{text-align:center;font-size:18px;line-height:1.3;margin-top:6px;word-break:break-all;}
.sc-bar{height:22px;background:#f1f5f9;border-radius:11px;overflow:hidden;}
.sc-bar>div{height:100%;width:0;border-radius:11px;transition:width .08s linear;}
.sc-price{font-weight:700;font-size:16px;}
.sc-chart{display:flex;align-items:flex-end;gap:6px;height:90px;padding:6px;background:#f8fafc;border-radius:12px;margin:8px 0;}
.sc-chart>div{flex:1;background:linear-gradient(#34d399,#10b981);border-radius:6px 6px 0 0;transition:height .4s;}
.sc-two{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.sc-basket{font-size:22px;text-align:center;min-height:56px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;letter-spacing:2px;}
.sc-cert{margin:4px 0 14px;padding:26px 18px;text-align:center;background:#fffbeb;border:6px double #f59e0b;border-radius:18px;box-shadow:0 6px 20px rgba(245,158,11,.2);}
</style>
</head>
<body>
<div class="hdr">
  <button class="back" id="homeBtn" onclick="goHome()" style="display:none">🏠 メニュー</button>
  <a href="manabiNote_v2.html" style="position:relative;z-index:2;color:#fff;font-size:11px;text-decoration:none;opacity:.9">◀ まなびノートへ</a>
  <div class="hdr-title">🌳 ツリーマネー・アドベンチャー</div>
  <div class="hdr-sub">つかう・ためる・ふやす を あそびながら まなぼう</div>
</div>
<div class="content" id="app"></div>

<script>
// ===== util =====
const $app = document.getElementById('app');
const yen = n => Math.round(n).toLocaleString('ja-JP') + '円';
const pct = r => (r>=0?'+':'') + Math.round(r*100) + '%';
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
function confetti(){
  const cs=['#34d399','#f59e0b','#ff6b9d','#60a5fa','#a78bfa'];
  for(let i=0;i<40;i++){
    const d=document.createElement('div'); d.className='confetti';
    d.style.left=Math.random()*100+'vw'; d.style.top='-10px';
    d.style.background=cs[i%cs.length]; d.style.animationDelay=Math.random()*.6+'s';
    d.style.borderRadius=Math.random()>.5?'50%':'2px';
    document.body.appendChild(d); setTimeout(()=>d.remove(),2800);
  }
}
function setHome(show){ document.getElementById('homeBtn').style.display=show?'block':'none'; window.scrollTo(0,0); }

// ===== settings =====
const START_AGE = 6, END_AGE = 18;
const BANK_RATE = 0.002;       // ちょきん（銀行）の利息 0.2%
const LONG_RATE = 0.04;        // 60歳まで の みらい予想に使う年4%
const TREE_STAGES = [
  {min:0,      e:'🌰', n:'たね'},
  {min:5000,   e:'🌱', n:'め'},
  {min:20000,  e:'🌿', n:'わかば'},
  {min:50000,  e:'🪴', n:'こえだ'},
  {min:100000, e:'🌳', n:'おおきな木'},
  {min:200000, e:'🍎', n:'みのる木'},
];
const treeOf = v => [...TREE_STAGES].reverse().find(s=>v>=s.min);
const incomeOf = age => 5000 + age*1000; // おとしだま＋おこづかいのあまり

// ===== 市場シナリオ（毎回すこしちがう）=====
function makeMarket(){
  const years = END_AGE-START_AGE;
  const base = [0.08,0.12,0.03,0.15,-0.06,0.10,0.06,0.18,-0.04,0.09,0.07,0.11];
  const arr = base.map(r=> r + (Math.random()-.5)*0.08);
  // 1回だけ「大暴落」の年をつくる（2〜8年目のどこか）
  const crash = 2 + Math.floor(Math.random()*6);
  arr[crash] = -0.25 - Math.random()*0.08;
  arr[crash+1] = 0.18 + Math.random()*0.08; // その後は回復しやすい
  return {returns:arr.slice(0,years), crash};
}

// ===== イベント =====
const EVENTS = [
  {e:'🎮', t:'ほしいゲームが はつばい！', d:'ともだちは みんな もってる…。3,000円 するよ。',
   choices:[
     {l:'🐷 ちょきんから かう', f:s=>{ if(s.savings>=3000){ s.savings-=3000; s.fun+=3; return 'ゲームをかった！たのしい！ ⭐+3'; } return 'ちょきんが たりなかった…。ほしいものの ために ためておくと いいね。'; }},
     {l:'✋ がまんして らいねん かんがえる', f:s=>{ s.badges.add('がまんマスター'); s.fun+=0; return 'えらい！「ほんとうに ほしいかな？」と かんがえるのは だいじ。'; }},
   ],
   lesson:'<b>ほしいもの</b>と<b>ひつようなもの</b>は ちがうよ。すぐ かうより「1しゅうかん まってから きめる」と、むだづかいが へるよ。'},
  {e:'🧹', t:'おてつだい がんばった！', d:'おうちの人から おれいに 2,000円 もらったよ。',
   choices:[
     {l:'🐷 ちょきんする', f:s=>{ s.savings+=2000; return 'ちょきんが 2,000円 ふえた！'; }},
     {l:'🍦 アイスを かう', f:s=>{ s.fun+=2; return 'アイス おいしい！ ⭐+2'; }},
   ],
   lesson:'お金は <b>はたらいた おれい</b> として もらえるもの。だれかの やくに たつと、お金が うまれるんだ。'},
  {e:'🕵️', t:'あやしい はなし…', d:'「ぜったい 2ばいに なるよ！ 5,000円 あずけて」と しらない人。',
   choices:[
     {l:'💸 あずけちゃう', f:s=>{ const x=Math.min(5000,s.savings); s.savings-=x; return `お金は もどってこなかった… ${yen(x)} なくなった。`; }},
     {l:'🙅 ことわって おうちの人に はなす', f:s=>{ s.badges.add('サギみやぶり'); return 'ナイス はんだん！ おうちの人も ほめてくれたよ。'; }},
   ],
   lesson:'<b>「ぜったい もうかる」は ぜったい ウソ</b>。ふえる かもしれない ものには、へる かもしれない リスクが かならず あるよ。'},
  {e:'🎂', t:'おばあちゃんから おいわい', d:'たんじょうびに 5,000円 もらった！',
   choices:[

let S = null;
function newGame(name, ch){
  const m = makeMarket();
  S = {name, ch, age:START_AGE, idx:0, savings:0, nisa:0, nisaIn:0, fun:0,
       shadowBank:0, // つみたて分を ぜんぶ ちょきん してたら
       market:m.returns, crashIdx:m.crash, sold:false, soldAge:null,
       alloc:null, badges:new Set(), hist:[{age:START_AGE, nisa:0, savings:0, nisaIn:0, shadow:0}],
       eventsLeft: shuffle([...EVENTS.keys()])};
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// --- 1. 配分 ---
function yearScreen(){
  setHome(true);
  const inc = incomeOf(S.age);
  if(!S.alloc || S.alloc.total!==inc){
    // 前の年の わりあいを ひきつぐ（はじめは 3:3:4）
    const p = S.alloc ? {use:S.alloc.use/S.alloc.total, save:S.alloc.save/S.alloc.total} : {use:.3,save:.3};
    const use = Math.round(inc*p.use/1000)*1000;
    const save = Math.round(inc*p.save/1000)*1000;
    S.alloc = {total:inc, use:Math.min(use,inc), save:Math.min(save,inc-Math.min(use,inc))};
    S.alloc.nisa = inc - S.alloc.use - S.alloc.save;
  }
  const a=S.alloc;
  const row=(k,ic,name,desc)=>`
    <div class="alloc"><span class="ic">${ic}</span><span class="t"><b>${name}</b><small>${desc}</small></span>
    <span class="stepper"><button data-k="${k}" data-d="-1">−</button><span class="amt" id="a_${k}">${yen(a[k])}</span><button data-k="${k}" data-d="1">＋</button></span></div>`;
  $app.innerHTML = statusHTML() + `
  <div class="card">
    <div class="sec-title">🧧 ${S.age}さいの おとしだま＆おこづかい：<span style="color:#f59e0b">${yen(inc)}</span></div>
    ${row('use','🍭','つかう','すぐ たのしい！ 1,000円で ⭐+1')}
    ${row('save','🐷','ちょきん','へらない。でも ほとんど ふえない（年0.2%）')}
    ${row('nisa','🌱','つみたて','世界の会社に ぶんさん投資。ふえたり へったり')}
    <div class="remain" id="remain"></div>
    <button class="btn" id="next">これで けってい！</button>
  </div>`;
  const upd=()=>{
    const left = a.total - a.use - a.save - a.nisa;
    ['use','save','nisa'].forEach(k=>document.getElementById('a_'+k).textContent=yen(a[k]));
    const r=document.getElementById('remain');
    r.textContent = left===0 ? '✅ ぴったり わけられたよ' : `のこり ${yen(left)}`;
    r.style.color = left===0 ? '#059669' : '#f59e0b';
    document.getElementById('next').disabled = left!==0;
  };
  $app.querySelectorAll('.stepper button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, d=+b.dataset.d*1000;
    const left = a.total - a.use - a.save - a.nisa;
    if(d>0 && left<=0){
      // のこりが ない時は ほかから 1000円 もってくる
      const from = ['nisa','save','use'].find(x=>x!==k && a[x]>=1000);
      if(!from) return; a[from]-=1000;
    }
    if(d<0 && a[k]<1000) return;
    a[k]+=d; upd();
  });
  upd();
  document.getElementById('next').onclick=()=>{
    S.fun += Math.floor(a.use/1000);
    S.savings += a.save;
    S.nisa += a.nisa; S.nisaIn += a.nisa;
    S.shadowBank += a.nisa;
    if(a.nisa>0) S.yearsInvested=(S.yearsInvested||0)+1;
    eventScreen();
  };
}

function eventScreen(){
  if(!S.eventsLeft.length) S.eventsLeft = shuffle([...EVENTS.keys()]);
  // 3年に2回くらい イベント
  if(Math.random()<.35){ marketScreen(); return; }
  const ev = EVENTS[S.eventsLeft.pop()];
  $app.innerHTML = statusHTML() + `
  <div class="card event">
    <div class="big">${ev.e}</div>
    <div class="sec-title center" style="margin-top:6px">${ev.t}</div>
    <div class="p-text center">${ev.d}</div>
    <div id="chs">${ev.choices.map((c,i)=>`<button class="choice" data-i="${i}">${c.l}</button>`).join('')}</div>
    <div id="out"></div>
  </div>`;
  $app.querySelectorAll('#chs .choice').forEach(b=>b.onclick=()=>{
    const msg = ev.choices[+b.dataset.i].f(S);

  });
}

// --- 3. 1年の けっか ---
function marketScreen(){
  const r = S.market[S.idx];
  const isCrash = S.idx===S.crashIdx;
  const before = S.nisa;
  S.nisa = S.nisa*(1+r);
  const bankGain = S.savings*BANK_RATE;
  S.savings += bankGain;
  S.shadowBank *= (1+BANK_RATE);
  const nisaDiff = S.nisa-before;
  const news = isCrash ? '📰 大ニュース！ 世界中で 株が 大きく 下がった！'
             : r>=0.12 ? '📰 世界の 会社が 大かつやく！'
             : r>=0 ? '📰 世界の 会社は まあまあ 元気'
             : '📰 ちょっと けいきが わるい 年だった';
  $app.innerHTML = statusHTML() + `
  <div class="card">
    <div class="sec-title">📅 ${S.age}さい の 1年の けっか</div>
    <div class="p-text">${news}</div>
    <div class="market ${r>=0?'up':'down'}">${r>=0?'📈':'📉'} ${pct(r)}</div>
    <div class="result-line"><span>🌱 つみたて</span><span class="${nisaDiff>=0?'up':'down'}">${nisaDiff>=0?'+':''}${yen(nisaDiff)}</span></div>
    <div class="result-line"><span>🐷 ちょきんの りそく</span><span class="up">+${yen(bankGain)}</span></div>
    <div id="crashBox"></div>
    <div id="nextBox"><button class="btn" style="margin-top:14px" id="nx">${S.idx+1>=S.market.length?'🎉 けっかを 見る':'つぎの 年へ ▶'}</button></div>
  </div>`;
  const tree=document.getElementById('tree');
  tree.classList.add(r>=0?'grow':'shake');
  if(isCrash && S.nisa>0){
    document.getElementById('nextBox').style.display='none';
    document.getElementById('crashBox').innerHTML = `
      <div class="lesson" style="background:#fef2f2;color:#7f1d1d">😱 みんな「こわい！ ぜんぶ うっちゃえ！」と さわいでる…<br>つみたて ${yen(S.nisa)} を どうする？</div>
      <button class="choice" id="sell">💨 こわいから ぜんぶ うって ちょきんに する</button>
      <button class="choice" id="hold">🧘 あわてず そのまま もちつづける</button>`;
    document.getElementById('sell').onclick=()=>{
      S.savings += S.nisa; S.nisa = 0; S.sold=true; S.soldAge=S.age;
      document.getElementById('crashBox').innerHTML = `<div class="lesson">下がった ときに うると、<b>そんが そのまま きまって</b> しまうんだ。この あと ねだんが もどっても、もう とりかえせない…。<br>らいねんからも つみたては つづけられるよ。</div>`;
      document.getElementById('nextBox').style.display='block';
    };
    document.getElementById('hold').onclick=()=>{
      S.badges.add('どっしり ホールド');
      document.getElementById('crashBox').innerHTML = `<div class="lesson">すごい！ 長い れきしで みると、大きく 下がっても <b>数年で もどる</b> ことが 多かったよ。<b>長く つづける人が いちばん 強い</b>んだ。（でも ぜったい ではないよ）</div>`;
      document.getElementById('nextBox').style.display='block';
    };
  }
  document.getElementById('nx').onclick=()=>{
    S.idx++; S.age++;
    S.hist.push({age:S.age, nisa:S.nisa, savings:S.savings, nisaIn:S.nisaIn, shadow:S.shadowBank});
    if(S.idx>=S.market.length) endScreen(); else yearScreen();
  };
}

// ===== すごろく 3D ボード（three.js）=====
const SG_RC = i=>{ const r=Math.floor(i/6); return [r, r%2===0 ? i%6 : 5-i%6]; };
function makeSg3D(el){
  const T=window.THREE;
  el.classList.add('sg3d');
  const renderer=new T.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
  el.appendChild(renderer.domElement);
  const scene=new T.Scene(); scene.background=new T.Color('#bfe9ff'); scene.fog=new T.Fog('#bfe9ff',16,38);
  const cam=new T.PerspectiveCamera(45,1,.1,100);
  scene.add(new T.HemisphereLight('#ffffff','#65a30d',.75));
  const sun=new T.DirectionalLight('#fff5dd',1.15); sun.position.set(-5,12,7); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
  Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:40}); sun.shadow.bias=-.002; scene.add(sun);
  const lam=(c,o={})=>new T.MeshLambertMaterial({color:c,...o});
  const emojiFont=px=>`${px}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  const emojiSprite=(e,s)=>{ const cv=document.createElement('canvas'); cv.width=cv.height=128; const x=cv.getContext('2d');
    x.font=emojiFont(100); x.textAlign='center'; x.textBaseline='middle'; x.fillText(e,64,70);
    const tx=new T.CanvasTexture(cv); tx.colorSpace=T.SRGBColorSpace; const sp=new T.Sprite(new T.SpriteMaterial({map:tx})); sp.scale.set(s,s,s); return sp; };

  // 地面・ボードの台・まわりの 木
  const ground=new T.Mesh(new T.PlaneGeometry(90,90),lam('#86efac')); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
  const S=1.3;
  const tp=i=>{ const [r,c]=SG_RC(i); return new T.Vector3((c-2.5)*S,0,(r-2.5)*S); };
  const base=new T.Mesh(new T.BoxGeometry(6*S+.6,.24,6*S+.6),lam('#fcd9a0')); base.position.y=-.08; base.receiveShadow=true; scene.add(base);
  for(let k=0;k<22;k++){
    const a=k/22*Math.PI*2+Math.random()*.2, r=6.6+Math.random()*4;
    const g=new T.Group(); g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
    const tr=new T.Mesh(new T.CylinderGeometry(.09,.13,.5,6),lam('#92400e')); tr.position.y=.25; tr.castShadow=true; g.add(tr);
    const lf=new T.Mesh(k%3?new T.ConeGeometry(.5,1.1,7):new T.IcosahedronGeometry(.55,0),lam(['#16a34a','#22c55e','#15803d'][k%3],{flatShading:true})); lf.position.y=k%3?1.0:.95; lf.castShadow=true; g.add(lf);
    g.scale.setScalar(.8+Math.random()*.6); scene.add(g);
  }

  // マス
  const tileTex=(i,t)=>{ const cv=document.createElement('canvas'); cv.width=cv.height=256; const x=cv.getContext('2d');
    x.fillStyle=SQ[t].c; x.fillRect(0,0,256,256);
    const stop=t==='J'||t==='G'; x.strokeStyle=stop?'#fb923c':'rgba(0,0,0,.10)'; x.lineWidth=stop?16:6; x.strokeRect(5,5,246,246);
    if(i>0&&i<BOARD.length-1){ x.fillStyle='#475569'; x.font='bold 44px sans-serif'; x.textAlign='left'; x.textBaseline='top'; x.fillText(String(i),16,12); }
    x.textAlign='center'; x.textBaseline='middle'; x.font=emojiFont(104); x.fillText(SQ[t].e,128,120);
    x.fillStyle='#1f2937'; x.font='bold 36px "Zen Maru Gothic","Hiragino Maru Gothic Pro",sans-serif'; x.fillText(SQ[t].n,128,214);
    const tx=new T.CanvasTexture(cv); tx.colorSpace=T.SRGBColorSpace; tx.anisotropy=4; return tx; };
  const tileH=[];
  BOARD.forEach((t,i)=>{
    const h=(t==='S'||t==='G')?.5:.3; tileH[i]=h;
    const side=lam(new T.Color(SQ[t].c).multiplyScalar(.82)), top=new T.MeshLambertMaterial({map:tileTex(i,t)});
    const m=new T.Mesh(new T.BoxGeometry(S*.9,h,S*.9),[side,side,top,side,side,side]);
    const p=tp(i); m.position.set(p.x,h/2,p.z); m.castShadow=true; m.receiveShadow=true; scene.add(m);
  });
  // すすむ むきの やじるし
  const arM=lam('#f97316'), arG=new T.ConeGeometry(.11,.24,10); arG.rotateX(Math.PI/2);
  for(let i=0;i<BOARD.length-1;i++){
    const a=tp(i), b=tp(i+1), d=b.clone().sub(a); const ar=new T.Mesh(arG,arM);
    ar.position.copy(a.clone().add(b).multiplyScalar(.5)); ar.position.y=.32; ar.rotation.y=Math.atan2(d.x,d.z); ar.castShadow=true; scene.add(ar);
  }
  const flag=emojiSprite('🏁',.9); flag.position.copy(tp(0)).setY(1.1); scene.add(flag);
  const cup=emojiSprite('🏆',1.2); cup.position.copy(tp(BOARD.length-1)).setY(1.3); scene.add(cup);
  const top=i=>tp(i).setY(tileH[i]);

  // コマ
  const cols=['#ef4444','#3b82f6','#22c55e','#a855f7','#f97316'];
  const toks=G.players.map((p,i)=>{
    const g=new T.Group();
    const b=new T.Mesh(new T.CylinderGeometry(.24,.28,.14,24),lam(cols[i%cols.length])); b.position.y=.07; b.castShadow=true; g.add(b);
    const sp=emojiSprite(p.ch,.85); sp.position.y=.62; g.add(sp);
    const ring=new T.Mesh(new T.TorusGeometry(.36,.04,8,32),new T.MeshBasicMaterial({color:'#facc15'})); ring.rotation.x=-Math.PI/2; ring.position.y=.04; ring.visible=false; g.add(ring);
    g.position.copy(top(0)); scene.add(g);
    return {g,ring,sp,target:top(0),hop:null};
  });
  const offsets=n=>n<=1?[[0,0]]:Array.from({length:n},(_,k)=>{ const a=k/n*Math.PI*2+Math.PI/4; return [Math.cos(a)*.3,Math.sin(a)*.3]; });
  function layout(){
    const by={}; G.players.forEach((p,i)=>{ (by[p.pos]=by[p.pos]||[]).push(i); });
    Object.entries(by).forEach(([pos,ids])=>{ const off=offsets(ids.length);
      ids.forEach((pi,k)=>{ toks[pi].target=top(+pos).add(new T.Vector3(off[k][0],0,off[k][1])); }); });
  }

  // サイコロ
  const pipTex=v=>{ const cv=document.createElement('canvas'); cv.width=cv.height=128; const x=cv.getContext('2d');
    x.fillStyle='#ffffff'; x.fillRect(0,0,128,128); x.strokeStyle='#e5e7eb'; x.lineWidth=6; x.strokeRect(3,3,122,122);
    const P={1:[[64,64]],2:[[34,34],[94,94]],3:[[30,30],[64,64],[98,98]],4:[[34,34],[94,34],[34,94],[94,94]],5:[[32,32],[96,32],[64,64],[32,96],[96,96]],6:[[34,28],[94,28],[34,64],[94,64],[34,100],[94,100]]}[v];
    x.fillStyle=v===1?'#ef4444':'#1f2937'; P.forEach(([a,b])=>{ x.beginPath(); x.arc(a,b,v===1?17:12,0,Math.PI*2); x.fill(); });
    const tx=new T.CanvasTexture(cv); tx.colorSpace=T.SRGBColorSpace; return new T.MeshLambertMaterial({map:tx}); };
  const dice=new T.Group(); const cube=new T.Mesh(new T.BoxGeometry(.7,.7,.7),[3,4,1,6,2,5].map(pipTex)); cube.castShadow=true; dice.add(cube); dice.visible=false; scene.add(dice);
  const FACE={1:[0,0,0],6:[Math.PI,0,0],2:[-Math.PI/2,0,0],5:[Math.PI/2,0,0],3:[0,0,Math.PI/2],4:[0,0,-Math.PI/2]};
  let diceAnim=null;

  // カメラ
  const camT=top(0).clone(); let active=0;
  const camOff=new T.Vector3(0,6.6,5.6);
  function resize(){ const w=el.clientWidth||300, h=el.clientHeight||300; renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }
  const ro=window.ResizeObserver?new ResizeObserver(resize):null; if(ro) ro.observe(el); resize();
  cam.position.copy(camT).add(camOff); cam.lookAt(camT);

  let raf=0, dead=false, last=performance.now();
  const loop=()=>{ if(dead) return; raf=requestAnimationFrame(loop);
    const now=performance.now(), dt=Math.min(.05,(now-last)/1000); last=now;
    toks.forEach((tk,i)=>{
      if(tk.hop){ const h=tk.hop, k=Math.min(1,(now-h.t0)/h.dur);
        tk.g.position.lerpVectors(h.a,h.b,k); tk.g.position.y+=Math.sin(Math.PI*k)*.75;
        tk.sp.scale.setScalar(.85*(1+.15*Math.sin(Math.PI*k)));
        if(k>=1){ tk.hop=null; h.done(); } }
      else tk.g.position.lerp(tk.target,1-Math.pow(.001,dt));
      tk.ring.visible=i===active; tk.ring.rotation.z+=dt*2;
    });
    if(diceAnim){ const a=diceAnim, k=Math.min(1,(now-a.t0)/a.dur), e=1-Math.pow(1-k,3);
      dice.position.set(a.p.x, a.p.y+ (1-k)*3.2 + Math.abs(Math.sin(k*Math.PI*3))*(1-k)*.8, a.p.z);
      cube.rotation.set(a.r[0]+(1-e)*a.s[0], a.r[1]+(1-e)*a.s[1], a.r[2]+(1-e)*a.s[2]);
      if(k>=1){ diceAnim=null; a.done(); } }
    const want=toks[active].g.position;
    camT.lerp(new T.Vector3(want.x*.85,0,want.z*.85+.3),1-Math.pow(.02,dt));
    cam.position.copy(camT).add(camOff); cam.lookAt(camT.x,camT.y+.3,camT.z);
    flag.position.y=1.1+Math.sin(now/400)*.08; cup.position.y=1.3+Math.sin(now/350)*.1;
    renderer.render(scene,cam);
  };
  layout(); toks.forEach(tk=>tk.g.position.copy(tk.target)); loop();

  return {
    sync(){ active=G.turn; G.players.forEach((p,i)=>{ toks[i].g.visible=true; }); layout(); },
    hop(pi,from,to){ return new Promise(res=>{ layout(); const tk=toks[pi];
      tk.hop={a:tk.g.position.clone(), b:top(to), t0:performance.now(), dur:480, done:()=>{ layout(); res(); }}; }); },
    roll(v){ return new Promise(res=>{ const p=toks[active].g.position.clone().add(new T.Vector3(.9,0,.7)); p.y=.66;
      dice.visible=true; dice.rotation.y=Math.random()*Math.PI*2;
      const sg=()=>(Math.random()<.5?-1:1)*Math.PI*2*(2+Math.floor(Math.random()*2));
      diceAnim={p, r:FACE[v], s:[sg(),sg(),sg()], t0:performance.now(), dur:1500, done:res}; }); },
    hideDice(){ dice.visible=false; },
    dispose(){ dead=true; cancelAnimationFrame(raf); if(ro) ro.disconnect(); renderer.dispose(); renderer.domElement.remove(); el.classList.remove('sg3d'); }
  };
}

function sgAsk(p, {icon,title,body='',lesson='',choices=['OK'],disabled=[],cpuPick=0}){

    </div>`;
    document.body.appendChild(m);
    const done=i=>{ m.remove(); res(i); };
    const bs=m.querySelectorAll('.choice');

      bs.forEach(b=>b.disabled=true);

      setTimeout(end, choices.length>1?4200:3200);
    } else bs.forEach(b=>b.onclick=()=>done(+b.dataset.i));
  });
}

// お金を はらう（たりない時は つみたてを うる → それでも たりなければ しゃっきん）
function payCost(p, amt){
  let note='';
  if(p.cash>=amt){ p.cash-=amt; return note; }
  let short = amt - Math.max(p.cash,0);
  p.cash = Math.min(p.cash,0);
  if(p.nisa>0){
    const s=Math.min(short,p.nisa); p.nisa-=s; short-=s;
    note+=`<br>👛 おさいふが たりなくて、つみたてを ${yen(s)} うった…`;
  }
  if(short>0){ p.cash-=short; note+=`<br>😱 それでも たりず ${yen(short)} の <b>しゃっきん</b>！ 毎年 10% の りそくが つくよ`; }
  return note;
}

function payday(p){
  const j=p.job;
  let pay = !j ? 1000 : j.pay!=null ? j.pay : Math.round((j.min+Math.random()*(j.max-j.min))/500)*500;
  p.cash += pay;
  if(j && j.fun) p.fun += j.fun;
  let t=0;
  if(p.tsumi>0 && p.cash>0){ t=Math.min(p.tsumi,p.cash); p.cash-=t; p.nisa+=t; p.nisaIn+=t; }
  fly(`💴 ${j?'きゅうりょう':'おこづかい'} +${yen(pay)}${t?`<br><small>🌱 つみたてへ ${yen(t)}</small>`:''}`);
  G.log = `${p.ch} ${j?'きゅうりょう':'おこづかい'} ${yen(pay)}${t?`（うち ${yen(t)} は じどうで つみたて）`:''}`;
}

async function sgTurn(p, id){
  sgRender();
  // さいしょの つみたて けいかく
  if(!p.tsumiSet){
    p.tsumiSet=true;
    const i = await sgAsk(p,{icon:'🌱',title:'さいしょに きめよう',
      body:'💴マスを とおると おこづかい <b>1,000円</b>。<br>そのうち いくらを <b>🌱つみたて</b> に まわす？<div class="sg-split">💴 1,000円 → 👛 おさいふ ＋ 🌱 つみたて</div><span class="small">👛 おさいふ：おかいものに つかえる<br>🌱 つみたて：1年ごとに 増えたり 減ったり する</span>',
      lesson:'まよったら <b>200円</b> が おすすめ。あとで 🌱マスで かえられるよ。',
      choices:['0円（ぜんぶ おさいふ）','200円（おすすめ）','500円'], cpuPick:1});
    if(!sgAlive(id)) return;
    p.tsumi=[0,200,500][i];
    sgRender();
  }
  // サイコロ
  if(p.cpu) await sgWait(1500);
  else { await new Promise(r=>{ G.waitRoll=r; sgRender(); }); }
  if(!sgAlive(id)) return;
  const roll=1+Math.floor(Math.random()*6);
  G.rolling=true; G.log=`${p.ch} サイコロを ふった！`; sgRender();
  const anim = G.g3 ? G.g3.roll(roll) : sgWait(1400);
  for(let k=0;k<14;k++){ G.dice=1+Math.floor(Math.random()*6); const d=document.getElementById('dice'); if(d) d.textContent=G.dice; await sgWait(100); if(!sgAlive(id)) return; }
  await anim; if(!sgAlive(id)) return;
  G.dice=roll; G.rolling=false; G.log=`${p.ch} ${roll} が でた！ ${roll}マス すすむよ`; sgRender();
  fly(`🎲 ${roll} が でた！`);
  await sgWait(1300); if(!sgAlive(id)) return;
  // すすむ（1マスずつ）
  for(let s=0;s<roll;s++){
    const from=p.pos; p.pos++;
    if(G.g3) await G.g3.hop(G.turn, from, p.pos); else { sgRender(); await sgWait(520); }
    if(!sgAlive(id)) return;
    sgRender();
    const t=BOARD[p.pos];
    if(t==='P'){ payday(p); sgRender(); await sgWait(1500); }
    else await sgWait(120);
    if(!sgAlive(id)) return;
    if((t==='J'&&!p.job) || t==='G') break;
  }
  if(G.g3) G.g3.hideDice();
  await sgWait(700); if(!sgAlive(id)) return;
  await sgLand(p, id);
  G.dice=null;
}

async function sgLand(p, id){
  const t=BOARD[p.pos], s=sc(p);
  if(t==='P' || t==='S'){ await sgWait(600); return; }
  G.log=`${p.ch} ${p.pos}ばんの ${SQ[t].e}${SQ[t].n}マスに とまった！`; sgRender();
  fly(`${SQ[t].e} ${SQ[t].n}マス！`);
  await sgWait(1300); if(!sgAlive(id)) return;
  if(t==='L'){
    const c=pick(LUCKY), a=c.a*s; p.cash+=a; if(c.f) p.fun+=c.f;
    await sgAsk(p,{icon:c.e,title:'🍀 ラッキー！',body:`${c.t}<br><b class="up">+${yen(a)}</b>${c.f?` ⭐+${c.f}`:''}`});
  }
  else if(t==='B'){
    const c=pick(BAD), a=c.a*s; const note=payCost(p,a); if(c.f) p.fun+=c.f;
    await sgAsk(p,{icon:c.e,title:'⚡ ピンチ！',body:`${c.t}<br><b class="down">−${yen(a)}</b>${note}`,lesson:c.l});
  }
  else if(t==='K'){
    const c=pick(SHOP), a=c.a*s, can=p.cash>=a;
    const buyPick = can && Math.random()<.6 ? 0 : 1;
    const i=await sgAsk(p,{icon:c.e,title:'🛍️ おかいもの',
      body:`${c.t}　<b>${yen(a)}</b><br>${c.gacha?'⭐ は 0〜5 の どれか（運しだい）':`かうと ⭐+${c.f}`}${can?'':'<br><span class="down">おさいふの お金が たりない…</span>'}`,
      lesson:c.l||'', choices:[`かう（−${yen(a)}）`,'がまんする'], disabled:[!can,false], cpuPick:buyPick});
    if(!sgAlive(id)) return;
    if(i===0){
      p.cash-=a; const f=c.gacha?Math.floor(Math.random()*6):c.f; p.fun+=f;
      fly(`${c.e} ⭐+${f}`); G.log=`${p.ch} ${c.t} を かった！ ⭐+${f}`;
    } else G.log=`${p.ch} がまんした`;
  }
  else if(t==='Q'){
    const q=pick(QUIZ), a=1500*s;
    const cpuPick = Math.random()<.65 ? q.a : (q.a+1)%q.c.length;
    const i=await sgAsk(p,{icon:'❓',title:'おかね クイズ',body:`<b>${q.q}</b><br><span class="small">せいかいで +${yen(a)} ⭐+1</span>`,
      choices:q.c.map((c,k)=>`${'ABC'[k]}. ${c}`), cpuPick});
    if(!sgAlive(id)) return;
    const ok=i===q.a; if(ok){ p.cash+=a; p.fun+=1; p.quizOk++; }
    await sgAsk(p,{icon:ok?'⭕':'❌',title:ok?`せいかい！ +${yen(a)} ⭐+1`:`ざんねん… こたえは ${'ABC'[q.a]}`,lesson:q.x});
  }
  else if(t==='T'){
    const has=p.cash>0;
    const half=Math.floor(Math.max(p.cash,0)/2/100)*100, all=Math.max(p.cash,0);
    const i=await sgAsk(p,{icon:'🌱',title:'つみたて チャンス！',
      body:`おさいふの ${money(p.cash)} から、つみたてに 入れる？<br><span class="small">入れた お金は ふえるかも。でも へる ことも あるよ</span>`,
      lesson:'ぜんぶ 入れると、ピンチの ときに こまる かも。<b>すぐ つかう お金は のこしておく</b> のが コツ。',
      choices:['入れない',`はんぶん（${yen(half)}）`,`ぜんぶ（${yen(all)}）`], disabled:[false,!has||half<=0,!has], cpuPick: has&&half>0?1:0});
    if(!sgAlive(id)) return;
    const put=[0,half,all][i]; p.cash-=put; p.nisa+=put; p.nisaIn+=put;
    if(put) fly(`🌱 +${yen(put)}`);
    // つみたて額の みなおし
    const opts = p.job ? [0,1000,2000,3000] : [0,200,500];
    const j=await sgAsk(p,{icon:'🔁',title:'毎回の じどう つみたて',body:`いまは ${yen(p.tsumi)}。かえる？`,
      choices:opts.map(v=>`${yen(v)}${v===p.tsumi?'（いまのまま）':''}`), cpuPick:Math.max(0,opts.indexOf(p.tsumi)) });
    if(!sgAlive(id)) return;
    p.tsumi=opts[j];
  }
  else if(t==='F'){
    const c=pick(SCAM);
    const i=await sgAsk(p,{icon:c.e,title:'🕵️ あやしい はなし',body:c.t,
      choices:['おもしろそう！ のってみる','ことわって おうちの人に そうだん'], cpuPick:Math.random()<.3?0:1});
    if(!sgAlive(id)) return;
    if(i===0){
      const lost=Math.max(0,Math.floor(p.cash/2)); p.cash-=lost; p.scammed=true;
      await sgAsk(p,{icon:'💸',title:'サギだった…',body:`おさいふの はんぶん <b class="down">${yen(lost)}</b> を とられた！`,lesson:c.l});
    } else {
      p.fun+=1; p.refused++;
      await sgAsk(p,{icon:'🛡️',title:'ナイス はんだん！ ⭐+1',lesson:c.l});
    }
  }
  else if(t==='J'){
    const opts=shuffle([...JOBS]).slice(0,3);
    const i=await sgAsk(p,{icon:'💼',title:'しごとを えらぼう！',body:'これからは 💴マスで きゅうりょうが もらえるよ。<br><span class="small">ここから先は お金の 出入りが 3ばいに なるよ</span>',
      choices:opts.map(j=>`${j.e} ${j.n}<br><span class="small" style="font-weight:400">${j.d}</span>`), cpuPick:Math.floor(Math.random()*3)});
    if(!sgAlive(id)) return;
    const j=opts[i]; p.job=j;
    let note=''; if(j.cost) note=payCost(p,j.cost);
    const k=await sgAsk(p,{icon:j.e,title:`${j.n} に なった！`,
      body:`${j.cost?`学費 ${yen(j.cost)} を はらった${note}<br>`:''}きゅうりょうから 毎回 いくら じどうで つみたてる？`,
      lesson:'おとなの NISA も「毎月 きまった 金額を じどうで」が 基本。<b>ほうっておいても 木が そだつ</b> しくみだよ。',
      choices:['0円','1,000円','2,000円','3,000円'], cpuPick:1});
    if(!sgAlive(id)) return;
    p.tsumi=[0,1000,2000,3000][k];
  }
  else if(t==='G'){
    G.finish++; p.done=true; p.place=G.finish;
    p.bonus=[10000,5000,2000,0][Math.min(G.finish-1,3)];
    p.cash+=p.bonus;
    await sgAsk(p,{icon:'🏆',title:`${G.finish}ばんめに ゴール！`,body:`ゴールボーナス <b class="up">+${yen(p.bonus)}</b><br>つみたては このあとも ほかの人が ゴールするまで うごきつづけるよ`});
  }
  sgRender();
}

async function sgYearEnd(id){
  const r = G.market[(G.round-1)%G.market.length];
  const crash = G.round===G.crashRound;
  const rows = G.players.map(p=>{ const b=p.nisa; p.nisa=Math.round(p.nisa*(1+r)); return `<tr><td>${p.ch} ${esc(p.name)}</td><td class="${p.nisa-b>=0?'up':'down'}">${p.nisa-b>=0?'+':''}${yen(p.nisa-b)}</td></tr>`; }).join('');
  let debt='';
  G.players.forEach(p=>{ if(p.cash<0){ const x=Math.ceil(-p.cash*0.1/100)*100; p.cash-=x; p.debtInt+=x; debt+=`<br>${p.ch} しゃっきんの りそく <span class="down">−${yen(x)}</span>`; }});
  G.lastR = r;
  const news = crash ? '📰 大ニュース！ 世界中で 株が 大きく 下がった！'
    : r>=0.12 ? '📰 世界の 会社が 大かつやく！' : r>=0 ? '📰 世界の 会社は まあまあ 元気' : '📰 ちょっと けいきが わるい 年…';
  sgRender();
  await sgAsk(null,{icon:r>=0?'📈':'📉',title:`1年 たったよ！（${G.round}年目 おわり）`,
    body:`${news}<div class="market ${r>=0?'up':'down'}">${pct(r)}</div><div class="small">みんなの つみたての うごき</div><table class="ptable">${rows}</table>${debt}`,
    lesson: G.round===1 ? '1年ごとに 世界の会社の ねだんが かわって、<b>つみたての お金も いっしょに 増えたり 減ったり</b> するよ。'
      : debt && !G.debtTold ? (G.debtTold=true,'しゃっきんには <b>りそく</b> が つく。かえさないと どんどん 大きく なるよ！') : '',
    choices:['つぎの 年へ ▶']});
  if(!sgAlive(id)) return;
  if(crash){
    for(const p of G.players){
      if(p.nisa<=0) continue;
      const i=await sgAsk(p,{icon:'😱',title:'つみたて どうする？',
        body:`みんな「こわい！ うっちゃえ！」と 大さわぎ…<br>つみたて <b>${yen(p.nisa)}</b> を どうする？`,
        choices:['💨 ぜんぶ うって おさいふに 入れる','🧘 あわてず そのまま もちつづける'], cpuPick:Math.random()<.5?0:1});
      if(!sgAlive(id)) return;
      if(i===0){ p.cash+=p.nisa; p.nisa=0; p.sold=true; p.tsumi=0;
        await sgAsk(p,{icon:'📉',title:'うって しまった…',lesson:'下がった ときに うると、<b>そんが そのまま きまって</b> しまう。このあと もどっても とりかえせない…（じどう つみたても とまったよ）'}); }
      else { p.held=true;
        await sgAsk(p,{icon:'🧘',title:'どっしり ホールド！',lesson:'れきしを みると、大きく 下がっても <b>数年で もどる</b> ことが 多かった。<b>長く つづける人が 強い</b>（でも ぜったい ではないよ）。'}); }
      if(!sgAlive(id)) return;
    }
  }
  G.round++;
  sgRender();
}

  confetti();
  setHome(true);
  $app.innerHTML = `

    <div style="font-weight:700;font-size:20px;margin:4px 0">けっか はっぴょう！</div>

  <div class="card">${ps.map((p,i)=>{

    if(p.refused) notes.push(`🛡️ あやしい話を ${p.refused}かい ことわった`);
    if(p.debtInt) notes.push(`😱 しゃっきんの りそくを ${yen(p.debtInt)} はらった`);
    if(p.quizOk) notes.push(`❓ クイズ ${p.quizOk}もん せいかい`);
    return `<div class="rank"><div class="m">${medal[i]}</div><div style="flex:1">
      <div><b>${p.ch} ${esc(p.name)}</b> ${p.job?`<span class="small">${p.job.e}${p.job.n}</span>`:''}</div>
      <div class="tot">${yen(p.total)}</div>

      <div class="p-text" style="font-size:12px;margin-top:4px">${notes.join('<br>')}</div></div></div>`;
  }).join('')}</div>
  <div class="card p-text">
    <b>すごろくで わかったこと</b>
    <ul style="margin-top:6px">
      <li>きゅうりょうから <b>さきに じどうで つみたて</b> すると、しぜんに たまる</li>
      <li>ピンチは とつぜん くる。<b>よびの お金</b> を のこしておこう</li>
      <li>投資は 下がる 年も ある。<b>あわてて うらない</b></li>
      <li>しゃっきんには りそくが つく。<b>かえすのが たいへん</b></li>
      <li>「ぜったい もうかる」は <b>サギ</b> の サイン</li>
      <li>お金を ためるだけじゃなく、<b>たのしく つかう⭐</b> のも 大切</li>
    </ul>
    <div class="lesson">💬 おうちの人と：「どの マスが いちばん ドキドキした？」「つぎは どう する？」</div>
  </div>
  <button class="btn pink" onclick="sgSetup()">🔁 もう1回 あそぶ</button>
  <button class="btn gray" onclick="goHome()">🏠 メニューへ</button>`;
  if(G.g3){ try{ G.g3.dispose(); }catch(e){} }
  G=null;
}

function schoolMap(){

  $app.innerHTML=`

function schoolChapter(i){
  const c=SCHOOL[i]; let k=0;
  setHome(true);
  const draw=()=>{
    const sl=c.slides[k];
    $app.innerHTML=`
    <div class="card">
      <div class="small">${c.e} ${i===SCHOOL.length-1?'さいご':`だい ${i+1} しょう`}：${c.t}　<span style="float:right">${k+1}/${c.slides.length}</span></div>
      <div class="sc-ill">${sl.e}</div>
      <div class="sc-st">${sl.t}</div>
      <div class="p-text sc-b">${sl.b}</div>
      <div class="sc-dots">${c.slides.map((_,j)=>`<i class="${j===k?'on':''}"></i>`).join('')}</div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn gray" style="flex:1" id="pv">${k?'◀ もどる':'🗺️ ちず'}</button>
      <button class="btn" style="flex:2;margin-top:0" id="nx">${k<c.slides.length-1?'つぎへ ▶':c.act?'🎮 やってみよう！':'📝 テストへ'}</button>
    </div>`;
    document.getElementById('pv').onclick=()=>{ if(k){k--;draw();} else schoolMap(); };
    document.getElementById('nx').onclick=()=>{ if(k<c.slides.length-1){k++;draw();window.scrollTo(0,0);} else if(c.act) schoolAct(i); else schoolQuiz(i); };
  };
  draw();
}

function actFrame(i,title,body){
  const c=SCHOOL[i];
  $app.innerHTML=`<div class="card"><div class="small">${c.e} ${c.t}：たいけん</div><div class="sec-title" style="margin-top:6px">${title}</div><div id="act">${body}</div></div>
  <button class="btn" id="actNext" disabled>📝 クイズへ ▶</button>`;
  window.scrollTo(0,0);
  const nx=document.getElementById('actNext'); nx.onclick=()=>schoolQuiz(i);
  return ()=>{ nx.disabled=false; };
}

  const id=SCHOOL[i].act; ACTS[id](i);
}

  stock(i){

        document.getElementById('snews').innerHTML+=`<div class="lesson">💡 1,000円で かった 株が いまは <b>${yen(price)}</b>、はいとうも ${yen(div)}。でも とちゅうで <b>下がった ときも あった</b> よね。株は ニュースで 上がったり 下がったり するんだ。</div>`; ok(); }

  fund(i){
    const cos=['🎮','🚗','🍔','💊','📱','✈️','🏠','👕','⚡','🍫'];
    const ok=actFrame(i,'🧺 1つの 会社 vs 投資信託',`
      <div class="sc-two"><div class="card" style="margin:0;padding:10px"><div class="center"><b>A</b> 1つだけ</div><div class="sc-basket">🎮</div><div class="center sc-price" id="fa">10,000円</div></div>
      <div class="card" style="margin:0;padding:10px"><div class="center"><b>B</b> 投資信託</div><div class="sc-basket" id="fbk">${cos.join('')}</div><div class="center sc-price" id="fb">10,000円</div></div></div>
      <div id="fnews" style="margin-top:10px"></div><button class="choice" id="go" style="text-align:center">📰 ニュースを 見る</button>`);
    let a=10000,b=10000,k=0;
    const ev=[['🎮💥','ゲーム会社で 大トラブル！ ゲーム会社の 株が 半分に…',-.5,-.05],['🌏📈','世界中の 会社が せいちょう！ どの会社も 少しずつ 上がった',.1,.1],['🎮🎉','ゲーム会社が 大ヒット作で ふっかつ！',.4,.04]];

      document.getElementById('fa').innerHTML=`<span class="${e[2]>=0?'up':'down'}">${yen(a)}</span>`; document.getElementById('fb').innerHTML=`<span class="${e[3]>=0?'up':'down'}">${yen(b)}</span>`;
      document.getElementById('fnews').innerHTML=`<div class="sc-bub">${e[0]} ${e[1]}<br><span class="small">A：${e[2]>0?'+':''}${Math.round(e[2]*100)}%　B：${e[3]>0?'+':''}${Math.round(e[3]*100)}%</span></div>`;

    };
  },
  tsumitate(i){
    const prices=[1000,800,500,700,1000,1200];
    const ok=actFrame(i,'📅 まいつき 1,000円ずつ かってみよう',`
      <div class="small">ある 投資信託の 1くち（1こ分）の ねだんが 毎月 かわるよ。まいつき <b>1,000円ぶん</b> かう。</div>
      <table class="ptable" id="tt"><tr><td>月</td><td>ねだん</td><td>かえた かず</td></tr></table>

    let m=0, units=0;
    document.getElementById('go').onclick=()=>{
      const p=prices[m], u=1000/p; units+=u; m++;
      document.getElementById('tt').insertAdjacentHTML('beforeend',`<tr><td>${m}月</td><td>${yen(p)}</td><td><b>${u.toFixed(2)}</b> くち ${p<1000?'🎉':''}</td></tr>`);
      if(m<prices.length){ document.getElementById('go').textContent=`🛒 ${m+1}か月め：1,000円ぶん かう`; return; }

      document.getElementById('tmsg').innerHTML=`<div class="result-line"><span>つみたて：${units.toFixed(2)}くち × ${yen(last)}</span><b class="up">${yen(val)}</b></div>

        <div class="lesson">💡 ねだんが <b>下がった 月に たくさん かえた</b> から、つみたての ほうが 多く なったね。下がった ときは「たくさん かえる チャンス」でも あるんだ。（いつも こう なるとは かぎらないよ）</div>`; ok();
    };

  nisa(i){

        <div class="card" style="margin:0;padding:10px;text-align:center;background:#ecfdf5"><b>NISA 🎁</b><div class="small">ぜいきん 0円</div><div class="sc-price up">0円</div><div class="small">てもとに</div><div class="sc-price up" id="nn"></div></div>

// ---------- クイズ ----------
function schoolQuiz(i){
  const c=SCHOOL[i];
  const qs = c.quiz==='final' ? shuffle(SCHOOL.slice(0,-1).flatMap(x=>x.quiz)).slice(0,10) : c.quiz;
  let k=0, score=0;
  const need = c.quiz==='final' ? 8 : 2;
  const draw=()=>{
    const q=qs[k];
    $app.innerHTML=`<div class="card">
      <div class="q-num">${c.e} ${c.t}　クイズ ${k+1} / ${qs.length}</div>
      <div class="progress"><div style="width:${k/qs.length*100}%"></div></div>
      <div class="q-text">${q.q}</div>
      <div id="cs">${q.c.map((t,j)=>`<button class="choice" data-j="${j}">${'ABC'[j]}. ${t}</button>`).join('')}</div><div id="ex"></div></div>`;
    window.scrollTo(0,0);
    let ans=false;
    $app.querySelectorAll('#cs .choice').forEach(b=>b.onclick=()=>{ if(ans) return; ans=true;
      const j=+b.dataset.j, okk=j===q.a; if(okk) score++;
      $app.querySelectorAll('#cs .choice').forEach((x,m)=>{ if(m===q.a) x.classList.add('ok'); else if(m===j) x.classList.add('ng'); });
      document.getElementById('ex').innerHTML=`<div class="center" style="font-size:20px;font-weight:700;margin-top:10px;color:${okk?'#059669':'#dc2626'}">${okk?'⭕ せいかい！':'❌ ざんねん'}</div><div class="lesson">💡 ${q.x}</div><button class="btn" id="qn" style="margin-top:12px">${k+1<qs.length?'つぎへ ▶':'けっかへ'}</button>`;
      document.getElementById('qn').onclick=()=>{ k++; if(k<qs.length) draw(); else result(); };
    });
  };
  const result=()=>{
    const pass=score>=need;
    const stars = c.quiz==='final' ? (score===10?3:score>=9?2:pass?1:0) : (score===3?3:score===2?2:0);
    const sv=scGet(); const prev=sv.stars[c.id]||0; if(stars>prev){ sv.stars[c.id]=stars; scSet(sv); }
    if(pass) confetti();
    const next=SCHOOL[i+1];
    const tip = {way:'🌱 「つみたて チャレンジ」で 12年間 ためして みよう！', guard:'🎲 「おかね すごろく」で サギや ピンチを たいけん しよう！'}[c.id];
    $app.innerHTML=`<div class="card center">
      <div style="font-size:56px">${pass?(c.quiz==='final'?'🎓':'🎉'):'💪'}</div>
      <div style="font-size:22px;font-weight:700;margin:6px 0">${score} / ${qs.length} もん せいかい</div>
      <div style="font-size:26px">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <div class="p-text" style="margin-top:6px">${pass?(c.quiz==='final'?'そつぎょう おめでとう！ きみは おかね はかせ だ！':'クリア！ つぎの しょうが ひらいたよ'):`${need}もん 以上 せいかいで クリア。もう1回 よんでから ちょうせん しよう！`}</div>
      ${pass&&tip?`<div class="lesson" style="text-align:left">${tip}</div>`:''}
    </div>
    ${pass&&c.quiz==='final'?`<button class="btn pink" onclick="schoolCert()">🎓 そつぎょう しょうしょを もらう</button>`:''}
    ${pass&&next?`<button class="btn" onclick="schoolChapter(${i+1})">▶ だい ${i+2} しょう「${next.t}」へ</button>`:''}
    ${!pass?`<button class="btn" onclick="schoolChapter(${i})">📖 もう1回 よむ</button><button class="btn" onclick="schoolQuiz(${i})">🔁 クイズだけ もう1回</button>`:''}
    <button class="btn gray" onclick="schoolMap()">🗺️ ちずに もどる</button>`;
    window.scrollTo(0,0);
  };
  draw();
}

function schoolCert(){
  setHome(true);
  const name=store.get('okane_name','')||'きみ';
  const st=scGet().stars, total=Object.values(st).reduce((a,b)=>a+b,0);
  const d=new Date();
  confetti();
  $app.innerHTML=`<div class="sc-cert">
    <div style="font-size:13px;letter-spacing:.3em;color:#b45309">そつぎょう しょうしょ</div>
    <div style="font-size:46px;margin:6px 0">🎓</div>
    <div style="font-size:22px;font-weight:700">${esc(name)} さん</div>
    <div class="p-text" style="margin:12px 0;line-height:2">あなたは「おかねの がっこう」で<br>お金の やくわり・ためかた・ふくり・株・<br>投資信託・NISA・お金の まもりかた を<br>しっかり まなび ました。<br><b>ここに「おかね はかせ」と みとめます。</b></div>
    <div style="font-size:22px">⭐ ${total} / ${SCHOOL.length*3}</div>
    <div class="small" style="margin-top:8px">${d.getFullYear()}年 ${d.getMonth()+1}月 ${d.getDate()}日　おかねの がっこう</div>
  </div>
  <div class="small center" style="margin-bottom:10px">📸 スクリーンショットで ほぞん できるよ</div>
  <button class="btn gray" onclick="schoolMap()">🗺️ ちずに もどる</button>`;
}

goHome();

<script>
// ===== オープニング（うた つき）=====
// オリジナル曲「おかねの木の うた」 120BPM・ハ長調
const SONG = {
  bpm:120, intro:2,
  lines:[ // [歌詞, MIDIノート, 拍]
    [['ち',67,.5],['い',67,.5],['さ',69,.5],['な',67,.5],['た',64,.5],['ね',67,.5],['を',72,1],['ま',69,.5],['い',69,.5],['た',67,.5],['な',64,.5],['ら',62,2]],
    [['コ',64,.5],['ツ',64,.5],['コ',67,.5],['ツ',67,.5],['コ',69,.5],['イ',69,.5],['ン',67,.5],['を',67,.5],['あ',65,.5],['げ',65,.5],['よ',64,.5],['う',62,.5],['よ',67,2]],
    [['さ',69,.5],['が',69,.5],['る',65,1],['ひ',67,.5],['だ',67,.5],['っ',64,.5],['て',60,.5],['へ',62,.5],['っ',62,.5],['ちゃ',64,.5],['ら',65,.5],['さ',67,2]],
    [['お',72,.5],['お',72,.5],['き',71,.5],['く',69,.5],['そ',67,.5],['だ',64,.5],['て',67,1],['お',67,.5],['か',69,.5],['ね',71,.5],['の',71,.5],['木',72,2]],
  ],
  // 2拍ごとの コード
  chords:['C','C','F','G', 'C','F','G','G', 'F','C','G','G', 'F','C','G','C'],
};
const SPACE_AFTER = [[3,6],[3,7],[2,6],[3,6]]; // 歌詞の 区切り（見やすさ用）
const CHORD_NOTES = {C:[60,64,67], F:[60,65,69], G:[59,62,67]};
const CHORD_BASS = {C:48, F:41, G:43};
const midiHz = m => 440*Math.pow(2,(m-69)/12);
const BEAT = 60/SONG.bpm;
const lineStart = i => (SONG.intro + i*8)*BEAT;      // 秒
const SONG_END = (SONG.intro + 32)*BEAT;              // 17秒
const SONG_LEN = SONG_END + 2.2;

// AudioContext / OfflineAudioContext の どちらにも 予約できる
function scheduleSong(ctx, t0, {lead=1}={}){
  const master=ctx.createGain(); master.gain.value=.55;
  const comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
  const noise=ctx.createBuffer(1, Math.floor(ctx.sampleRate*.2), ctx.sampleRate);
  const nd=noise.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  const tone=(type,f,t,d,vol,{lp=4000,att=.01,rel=.06,vib=0}={})=>{
    const o=ctx.createOscillator(), g=ctx.createGain(), fl=ctx.createBiquadFilter();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(vib){ const l=ctx.createOscillator(), lg=ctx.createGain(); l.frequency.value=5.5; lg.gain.value=f*.006; l.connect(lg); lg.connect(o.frequency); l.start(t+.12); l.stop(t+d+rel); }
    fl.type='lowpass'; fl.frequency.value=lp;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+att);
    g.gain.setValueAtTime(vol*.8,t+Math.max(att,d-rel)); g.gain.linearRampToValueAtTime(0,t+d);
    o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t+d+.02);
  };
  const hit=(t,vol,hp,d)=>{ const s=ctx.createBufferSource(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    s.buffer=noise; f.type='highpass'; f.frequency.value=hp; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+d+.01); };
  const kick=t=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(45,t+.15);
    g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.18); o.connect(g); g.connect(master); o.start(t); o.stop(t+.2); };
  // イントロ（カウント）
  for(let b=0;b<SONG.intro;b++){ hit(t0+b*BEAT,.35,3000,.06); tone('triangle',midiHz(b?79:84),t0+b*BEAT,.12,.12); }
  // メロディ
  SONG.lines.forEach((ln,i)=>{ let t=t0+lineStart(i);
    ln.forEach(([,m,b])=>{ const d=b*BEAT;
      if(lead>0){ tone('square',midiHz(m),t,d*.92,.10*lead,{lp:2600,vib:b>=1});
      tone('triangle',midiHz(m+12),t,d*.92,.05*lead,{lp:5000}); }
      t+=d; }); });
  // ばんそう（ベース・コード・ドラム）
  SONG.chords.forEach((c,k)=>{ const t=t0+(SONG.intro+k*2)*BEAT;
    tone('triangle',midiHz(CHORD_BASS[c]),t,BEAT*.9,.32,{lp:900});
    tone('triangle',midiHz(CHORD_BASS[c]+7),t+BEAT,BEAT*.8,.22,{lp:900});
    CHORD_NOTES[c].forEach(n=>{ tone('triangle',midiHz(n),t+BEAT*.5,BEAT*.3,.045); tone('triangle',midiHz(n),t+BEAT*1.5,BEAT*.3,.045); });
    kick(t); hit(t+BEAT,.16,1500,.12);
    for(let e=0;e<4;e++) hit(t+e*BEAT/2,.07,7000,.04);
  });
  // さいごの ファンファーレ
  const tf=t0+SONG_END;
  [72,76,79].forEach((m,i)=>tone('square',midiHz(m),tf+i*.09,.18,.09,{lp:3000}));
  [60,64,67,72,84].forEach(m=>tone('triangle',midiHz(m),tf+.3,1.8,.09,{rel:1.2}));
  tone('square',midiHz(84),tf+.3,1.6,.07,{lp:3000,vib:1,rel:1});
  kick(tf+.3); hit(tf+.3,.3,800,1.2);
}

// ===== 3D オープニング（three.js）=====
const THREE_URL='https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js';
let THREE_PROMISE=null;
function loadThree(){
  if(window.THREE) return Promise.resolve(true);
  if(THREE_PROMISE) return THREE_PROMISE;
  THREE_PROMISE=new Promise(res=>{
    const s=document.createElement('script'); s.src=THREE_URL; s.async=true;
    s.onload=()=>res(!!window.THREE); s.onerror=()=>res(false);
    document.head.appendChild(s);
    setTimeout(()=>res(!!window.THREE),6000);
  });
  return THREE_PROMISE;
}
function webglOK(){ try{ const c=document.createElement('canvas'); return !!(c.getContext('webgl2')||c.getContext('webgl')); }catch(e){ return false; } }

const clamp01=x=>Math.max(0,Math.min(1,x));
const smooth=(a,b,x)=>{ const t=clamp01((x-a)/(b-a)); return t*t*(3-2*t); };
const easeBack=x=>{ x=clamp01(x); const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); };
const easeBounce=x=>{ x=clamp01(x); const n=7.5625,d=2.75;
  if(x<1/d) return n*x*x; if(x<2/d) return n*(x-=1.5/d)*x+.75; if(x<2.5/d) return n*(x-=2.25/d)*x+.9375; return n*(x-=2.625/d)*x+.984375; };
const lerp=(a,b,t)=>a+(b-a)*t;

function make3D(container){
  const T=window.THREE;
  const renderer=new T.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(2,window.__opPR||window.devicePixelRatio||1));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
  renderer.domElement.className='op-3d';
  container.insertBefore(renderer.domElement, container.firstChild);
  const scene=new T.Scene();
  const night=new T.Color('#1e1b4b'), dusk=new T.Color('#7c3aed'), day=new T.Color('#8fd8fb'), bg=new T.Color();
  scene.background=bg; scene.fog=new T.Fog(bg.clone(),28,70);
  const cam=new T.PerspectiveCamera(50,1,.1,200);
  const hemi=new T.HemisphereLight('#ffffff','#4d7c0f',.5); scene.add(hemi);
  const sunL=new T.DirectionalLight('#fff4d6',1.3);
  sunL.position.set(6,12,6); sunL.castShadow=true; sunL.shadow.mapSize.set(1024,1024);
  Object.assign(sunL.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:40}); sunL.shadow.bias=-.002;
  scene.add(sunL);
  const lam=(c,o={})=>new T.MeshLambertMaterial({color:c,flatShading:true,...o});
  const mesh=(g,m,sh=true)=>{ const x=new T.Mesh(g,m); x.castShadow=sh; x.receiveShadow=true; return x; };

  // 地面（ローポリの おか）
  const hill=(x,z)=>{ const r=Math.hypot(x,z); return -(x*x+z*z)/90 + .3*Math.sin(x*.7+1)*Math.cos(z*.6)*smooth(2,6,r); };
  const gg=new T.PlaneGeometry(120,120,70,70); gg.rotateX(-Math.PI/2);
  const pos=gg.attributes.position;
  for(let i=0;i<pos.count;i++) pos.setY(i,hill(pos.getX(i),pos.getZ(i)));
  gg.computeVertexNormals();
  const ground=mesh(gg,lam('#4ade80'),false); scene.add(ground);
  // くさ・はな・いし（おくゆき感）
  const deco=new T.Group(); scene.add(deco);
  for(let i=0;i<60;i++){
    const a=Math.random()*Math.PI*2, r=2.2+Math.random()*12;
    const x=Math.cos(a)*r, z=Math.sin(a)*r, y=hill(x,z);
    let m;
    if(i%5===0){ m=mesh(new T.DodecahedronGeometry(.18+Math.random()*.2,0),lam('#94a3b8')); }
    else if(i%3===0){ m=new T.Group();
      const st=mesh(new T.CylinderGeometry(.02,.02,.35,5),lam('#15803d')); st.position.y=.17; m.add(st);
      const fl=mesh(new T.IcosahedronGeometry(.11,0),lam(['#f472b6','#facc15','#ffffff','#a78bfa'][i%4])); fl.position.y=.36; m.add(fl); }
    else { m=mesh(new T.ConeGeometry(.08,.35+Math.random()*.25,4),lam('#22c55e')); m.position.y=.15; }
    const g=new T.Group(); g.add(m); g.position.set(x,y,z); deco.add(g);
  }
  // ほし
  const sg=new T.BufferGeometry(), sp=[];
  for(let i=0;i<400;i++){ const a=Math.random()*Math.PI*2, e=Math.random()*1.2+.05, r=60; sp.push(Math.cos(a)*Math.cos(e)*r, Math.sin(e)*r, Math.sin(a)*Math.cos(e)*r); }
  sg.setAttribute('position',new T.Float32BufferAttribute(sp,3));
  const starM=new T.PointsMaterial({color:'#ffffff',size:.5,transparent:true,fog:false});
  scene.add(new T.Points(sg,starM));
  // たいよう
  const sunBall=new T.Mesh(new T.SphereGeometry(2.2,24,16),new T.MeshBasicMaterial({color:'#fde047',fog:false}));
  const glow=new T.Mesh(new T.SphereGeometry(3.4,24,16),new T.MeshBasicMaterial({color:'#fef08a',transparent:true,opacity:.35,fog:false}));
  sunBall.add(glow); scene.add(sunBall);
  // くも
  const clouds=new T.Group(); scene.add(clouds);
  for(let i=0;i<6;i++){ const c=new T.Group();
    for(let k=0;k<4;k++){ const b=new T.Mesh(new T.IcosahedronGeometry(1+Math.random()*.6,1),new T.MeshLambertMaterial({color:'#ffffff',flatShading:true,transparent:true,opacity:.95}));
      b.position.set(k*1.1-1.6,Math.random()*.4,Math.random()*.6); c.add(b); }
    const a=i/6*Math.PI*2; c.position.set(Math.cos(a)*30,10+Math.random()*5,Math.sin(a)*30); c.lookAt(0,c.position.y,0); clouds.add(c); }

  // たね
  const seed=mesh(new T.SphereGeometry(.32,16,12),lam('#92400e')); seed.scale.set(1,.85,1); scene.add(seed);
  const seedCap=mesh(new T.SphereGeometry(.2,12,8,0,Math.PI*2,0,Math.PI/2),lam('#78350f')); seedCap.position.y=.18; seed.add(seedCap);
  // め
  const sprout=new T.Group(); scene.add(sprout);
  const stem=mesh(new T.CylinderGeometry(.04,.05,1,6),lam('#65a30d')); stem.geometry.translate(0,.5,0); sprout.add(stem);
  const leafG=new T.SphereGeometry(.28,10,8); leafG.scale(1,.25,.55);
  const leafL=mesh(leafG,lam('#84cc16')); leafL.position.set(-.25,1,0); leafL.rotation.z=.4; sprout.add(leafL);
  const leafR=mesh(leafG,lam('#84cc16')); leafR.position.set(.25,1,0); leafR.rotation.z=-.4; sprout.add(leafR);
  // 木
  const tree=new T.Group(); scene.add(tree);
  const trunkG=new T.CylinderGeometry(.22,.38,1,8); trunkG.translate(0,.5,0);
  const trunk=mesh(trunkG,lam('#8b5a2b')); tree.add(trunk);
  const crown=new T.Group(); tree.add(crown);
  const leafCols=['#16a34a','#22c55e','#15803d','#4ade80','#16a34a'];
  [[0,0,0,1.25],[.9,-.25,.3,.85],[-.85,-.2,.2,.9],[.2,.3,-.8,.85],[-.2,.55,.6,.8]].forEach(([x,y,z,r],i)=>{
    const b=mesh(new T.IcosahedronGeometry(r,1),lam(leafCols[i])); b.position.set(x,y,z); crown.add(b); });
  // りんご
  const apples=[];
  [[1.1,.1,.8],[-1.2,.2,.6],[.3,-.5,1.2],[-.5,.7,1],[1,.7,-.4],[-.9,-.3,-.9],[.5,1.2,.3],[.1,.1,-1.3]].forEach(p=>{
    const a=new T.Group();
    const b=mesh(new T.SphereGeometry(.24,12,10),new T.MeshPhongMaterial({color:'#ff3b3b',emissive:'#5a0a0a',shininess:70})); a.add(b);
    const st=mesh(new T.CylinderGeometry(.015,.015,.12,4),lam('#713f12')); st.position.y=.22; a.add(st);
    a.position.set(...p); a.scale.setScalar(0); crown.add(a); apples.push(a); });
  // コイン
  const coinG=new T.CylinderGeometry(.32,.32,.07,28); coinG.rotateX(Math.PI/2);
  const coinM=new T.MeshPhongMaterial({color:'#fbbf24',emissive:'#7c4a03',specular:'#fff7cc',shininess:90});
  const coins=[];
  for(let i=0;i<18;i++){ const c=mesh(coinG,coinM); c.visible=false;
    c.userData={x:(Math.random()-.5)*4,z:(Math.random()-.5)*4,delay:i*.11,spin:3+Math.random()*4}; scene.add(c); coins.push(c); }
  // まわる コイン（みのった あと）
  const orbit=new T.Group(); scene.add(orbit);
  for(let i=0;i<6;i++){ const c=mesh(coinG,coinM); const a=i/6*Math.PI*2; c.position.set(Math.cos(a)*2.4,0,Math.sin(a)*2.4); orbit.add(c); }
  orbit.visible=false;
  // グラフ（下がって 上がる）
  const chart=new T.Group(); scene.add(chart);
  const cp=[[-2.6,0],[-1.9,.35],[-1.2,.7],[-.6,.5],[0,-.25],[.6,.75],[1.3,1.25],[1.95,1.7],[2.6,2.25]].map(([x,y])=>new T.Vector3(x,y,0));
  const curve=new T.CatmullRomCurve3(cp,false,'catmullrom',.1);
  const tubeG=new T.TubeGeometry(curve,160,.07,8,false);
  const tubeM=new T.MeshBasicMaterial({color:'#ffffff',transparent:true});
  const tube=new T.Mesh(tubeG,tubeM); chart.add(tube);
  const head=new T.Mesh(new T.SphereGeometry(.14,12,10),new T.MeshBasicMaterial({color:'#fde047',transparent:true})); chart.add(head);
  const axisM=new T.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:.5});
  const axis=new T.Mesh(new T.BoxGeometry(5.4,.03,.03),axisM); axis.position.set(0,-.6,0); chart.add(axis);
  const tubeIdx=tubeG.index.count;
  // どうぶつ（えもじ スプライト）
  const animals=['🐰','🐻','🐱','🐶','🦊'].map((e,i)=>{
    const cv=document.createElement('canvas'); cv.width=cv.height=128; const cx=cv.getContext('2d');
    cx.font='100px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(e,64,70);
    const tx=new T.CanvasTexture(cv); tx.colorSpace=T.SRGBColorSpace;
    const s=new T.Sprite(new T.SpriteMaterial({map:tx,transparent:true})); s.scale.set(.9,.9,.9); s.visible=false; scene.add(s); return s; });

  const groundY=hill;
  const growth=t=>{ // 木の そだち 0〜1
    let g=0;
    [[lineStart(1)+.9,.12],[lineStart(1)+1.9,.13],[lineStart(1)+2.9,.15],[lineStart(3)+.3,.6]].forEach(([t0,amt])=>{ g+=amt*easeBack((t-t0)/.7); });
    return g;
  };
  const camKeys=[ // [時間, 半径, 高さ, 見る高さ]
    [0,7,2.2,.6],[4.5,7.5,2.4,.9],[8.6,9,2.8,1.4],[9.4,11,3.4,2.3],[12.8,11.5,3.4,2.5],[14.2,14,3.4,3],[17,15.5,3.4,3],[22,16.5,3.6,3]];
  const camAt=t=>{ let i=0; while(i<camKeys.length-2 && t>camKeys[i+1][0]) i++;
    const a=camKeys[i], b=camKeys[i+1], k=smooth(a[0],b[0],t); return [lerp(a[1],b[1],k),lerp(a[2],b[2],k),lerp(a[3],b[3],k)]; };

  function update(t){
    // そら
    const d1=smooth(1.2,2.6,t), d2=smooth(2.2,4.2,t);
    bg.copy(night).lerp(dusk,d1*(1-d2)).lerp(day,d2); scene.fog.color.copy(bg);
    starM.opacity=1-smooth(1.8,3.4,t);
    const sa=lerp(-.25,1.05,smooth(1.2,4.5,t));
    sunBall.position.set(14,Math.sin(sa)*26-3,-30);
    sunL.intensity=.25+1.15*d2; hemi.intensity=.25+.45*d2;
    clouds.rotation.y=t*.02;
    // たね
    const fall=easeBounce((t-.2)/1.1);
    seed.visible=t<lineStart(1)+1.3;
    seed.position.set(0,lerp(9,.25,fall),0); seed.rotation.z=(1-fall)*6;
    if(t>lineStart(1)+.8) seed.scale.setScalar(Math.max(0,1-(t-lineStart(1)-.8)/.5));
    else seed.scale.set(1,.85,1);
    // コイン
    coins.forEach(c=>{ const u=c.userData, s=lineStart(1)+u.delay, k=(t-s)/1.0;
      c.visible=k>0&&k<1.25;
      if(!c.visible) return;
      const f=Math.min(1,k);
      c.position.set(u.x*(1-f*.85),lerp(10,.3,f*f),u.z*(1-f*.85));
      c.rotation.set(t*u.spin,t*u.spin*.7,0);
      c.scale.setScalar(k>1?Math.max(0,1-(k-1)*4):1); });
    // め と 木
    const g=growth(t);
    const sproutK=clamp01(g/.12);
    sprout.visible=g>0.001 && g<.42;
    sprout.scale.setScalar(.2+.8*sproutK*(1-smooth(.3,.42,g)));
    const tg=smooth(.25,1,g);
    tree.visible=g>.25;
    trunk.scale.set(.4+.6*tg,.3+2.5*tg,.4+.6*tg);
    crown.position.y=.3+2.5*tg+.7*tg;
    crown.scale.setScalar(.25+1.05*tg);
    crown.rotation.y=Math.sin(t*.8)*.05;
    // グラフ
    const cs=lineStart(2), ce=lineStart(3)+.2;
    const cv=t>cs-.2 && t<ce+.8;
    chart.visible=cv;
    if(cv){
      const p=clamp01((t-cs)/2.8);
      tubeG.setDrawRange(0,Math.floor(tubeIdx*p/3)*3);
      head.position.copy(curve.getPointAt(Math.max(.001,p)));
      const op=1-smooth(ce,ce+.7,t); tubeM.opacity=op; head.material.opacity=op; axisM.opacity=.5*op;
      chart.position.set(0,3.6,0); chart.scale.setScalar(.85);
      chart.quaternion.copy(cam.quaternion);
    }
    // りんご と まわる コイン
    apples.forEach((a,i)=>a.scale.setScalar(easeBack((t-(lineStart(3)+2)-i*.09)/.5)));
    orbit.visible=t>lineStart(3)+2.1;
    orbit.position.y=2.4; orbit.rotation.y=t*.9;
    orbit.children.forEach((c,i)=>{ c.rotation.y=t*3+i; c.position.y=Math.sin(t*2+i)*.4; c.scale.setScalar(easeBack((t-(lineStart(3)+2.1)-i*.06)/.5)); });
    animals.forEach((s,i)=>{ s.visible=t>SONG_END+.9+i*.12; });
    // カメラ（ゆっくり まわりこむ）
    const [r,h,ly]=camAt(t), th=.35+t*.11;
    cam.position.set(Math.sin(th)*r,h,Math.cos(th)*r);
    cam.lookAt(0,ly,0);
    // どうぶつは カメラの 前に ならぶ
    if(t>SONG_END+.5){ const fwd=new T.Vector3(Math.sin(th),0,Math.cos(th)), side=new T.Vector3(fwd.z,0,-fwd.x);
      animals.forEach((s,i)=>{ if(!s.visible) return; const k=clamp01((t-(SONG_END+.9+i*.12))/.9);
        const tx=(i-2)*1.0, off=lerp(10,tx,1-Math.pow(1-k,3)), base=fwd.clone().multiplyScalar(3.2).add(side.clone().multiplyScalar(-off));
        s.position.x=base.x; s.position.z=base.z; s.position.y=groundY(base.x,base.z)+.5+Math.abs(Math.sin(t*6+i))*(k<1?.5:.25); }); }
  }
  function resize(){ const w=container.clientWidth, h=container.clientHeight; renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }
  resize(); window.addEventListener('resize',resize);
  let raf=0, t0=null, dead=false;
  const loop=()=>{ if(dead) return; raf=requestAnimationFrame(loop);
    const t=t0==null?0:(performance.now()-t0)/1000; update(t); renderer.render(scene,cam); };
  update(0); renderer.render(scene,cam);
  return {
    start(){ t0=performance.now(); loop(); },
    renderAt(t){ update(t); renderer.render(scene,cam); },
    dispose(){ dead=true; cancelAnimationFrame(raf); window.removeEventListener('resize',resize); renderer.dispose(); renderer.domElement.remove(); }
  };
}

let OP_AUDIO=null, OP_3D=null;
function stopSong(){ if(OP_AUDIO){ try{ OP_AUDIO.close(); }catch(e){} OP_AUDIO=null; } }

function playOpening(opts={}){
  const old=document.getElementById('op'); if(old) old.remove();
  stopSong();
  const op=document.createElement('div'); op.id='op'; op.className='op';
  const stars=Array.from({length:22},()=>`<span class="op-star" style="left:${Math.random()*96}%;top:${Math.random()*55}%;animation-delay:${Math.random()*1.6}s">✦</span>`).join('');
  const coins=Array.from({length:14},(_,i)=>`<span class="op-coin" style="left:${8+Math.random()*84}%;animation-delay:${(i*0.09).toFixed(2)}s">${i%4===0?'💴':'🪙'}</span>`).join('');
  const sparks=[[28,60,'🍎'],[62,58,'🍎'],[45,55,'✨'],[20,70,'🪙'],[72,68,'🪙'],[38,64,'🍎'],[56,66,'✨']].map(([x,y,e],i)=>`<span class="op-spark" style="left:${x}%;top:${y}%;animation-delay:${i*0.1}s">${e}</span>`).join('');
  const letters=(t,d0)=>[...t].map((c,i)=>`<span class="ch" style="animation-delay:${(d0+i*0.08).toFixed(2)}s">${c}</span>`).join('');
  op.innerHTML=`<div class="op-in">
    <div class="op-stars">${stars}</div>
    <div class="op-sun">☀️</div>
    <div class="op-stage">
      <div class="op-ground"></div>
      ${coins}
      <svg class="op-chart" viewBox="0 0 300 100" preserveAspectRatio="none"><path d="M5,85 L40,76 L75,66 L105,72 L135,93 L165,64 L200,48 L235,36 L265,22 L295,8"/></svg>
      ${sparks}
      <div class="op-tree" id="opTree">🌰</div>
    </div>
    <div class="op-song">🎵 おかねの木の うた</div>
    <div class="op-cap" id="opCap"></div>
    <div class="op-title"><span class="l2">${letters('ツリーマネー',0.1)}</span><span class="l1">${letters('アドベンチャー',0.6)}</span></div>
    <div class="op-chars">${['🐰','🐻','🐱','🐶','🦊'].map((c,i)=>`<span style="animation-delay:${(1+i*0.12).toFixed(2)}s,${(1.9+i*0.1).toFixed(2)}s">${c}</span>`).join('')}</div>
    <button class="op-start" id="opStart">▶ タップして はじめる</button>
    <div class="op-gate" id="opGate">
      <div style="font-size:64px" class="wob">🌰</div>
      <button class="op-gbtn" id="opPlay">🎵 タップして はじまり！</button>
      <button class="op-gmute" id="opMute">おとなしで みる</button>
    </div>
    ${opts.noSkip?'':'<button class="op-skip" id="opSkip">スキップ ▶▶</button>'}
  </div>`;
  document.body.appendChild(op);
  const want3D = !opts.no3d && webglOK();
  if(want3D) loadThree();
  const tree=op.querySelector('#opTree'), cap=op.querySelector('#opCap');
  const timers=[]; const at=(s,f)=>timers.push(setTimeout(f,s*1000));
  const grow=(e,size)=>{ tree.classList.remove('drop','pop'); void tree.offsetWidth; tree.textContent=e; tree.style.fontSize=size+'px'; tree.classList.add('pop'); };
  const close=()=>{ timers.forEach(clearTimeout); stopSong(); if(OP_3D){ const g3=OP_3D; OP_3D=null; setTimeout(()=>g3.dispose(),500); } op.classList.add('out'); setTimeout(()=>op.remove(),500); try{ sessionStorage.setItem('op_seen','1'); }catch(e){} };
  // カラオケ字幕
  const sing=i=>{
    const ln=SONG.lines[i];
    cap.innerHTML=ln.map(([s],k)=>`<span class="k" id="k${i}_${k}">${s}</span>${SPACE_AFTER[i].includes(k)?' ':''}`).join('');
    cap.classList.add('show');
  };
  const karaoke=i=>{ // 1文字ずつ 色を かえる（はじめからの 時間で 予約）
    let t=lineStart(i);
    SONG.lines[i].forEach(([,,b],k)=>{ at(t,()=>{ const e=document.getElementById(`k${i}_${k}`); if(e) e.classList.add('on'); }); t+=b*BEAT; });
  };
  const run=async(withSound)=>{
    const g=op.querySelector('#opGate'); if(g) g.remove();
    let ac=null;
    if(withSound){ try{ const C=window.AudioContext||window.webkitAudioContext; ac=new C(); if(ac.resume) ac.resume(); }catch(e){} } // タップ中に つくる（iPhone 対策）
    if(want3D){ // 3D を ためす（読みこみは さいだい 1.5秒 まつ）
      const ok=await Promise.race([loadThree(), new Promise(r=>setTimeout(()=>r(false), opts.wait3d||1500))]);
      if(ok && window.THREE && document.body.contains(op)){
        try{ OP_3D=make3D(op.querySelector('.op-in')); op.classList.add('op3d'); window.__op3d=OP_3D; }catch(e){ OP_3D=null; }
      }
    }
    if(!document.body.contains(op)) return;
    if(ac){ OP_AUDIO=ac; try{ scheduleSong(ac, ac.currentTime+.05); }catch(e){} }
    timeline();
    if(OP_3D && !opts.manual3d) OP_3D.start();
  };
  const timeline=()=>{
    op.classList.add('run');
    window.__opStart=performance.now();
    at(.2, ()=>tree.classList.add('drop'));
    SONG.lines.forEach((_,i)=>{ at(lineStart(i)-.15,()=>sing(i)); karaoke(i); });
    at(2.8, ()=>op.classList.add('day'));
    at(lineStart(1), ()=>op.classList.add('rain'));
    at(lineStart(1)+.9, ()=>grow('🌱',56));
    at(lineStart(1)+1.9,()=>grow('🌿',72));
    at(lineStart(1)+2.9,()=>grow('🪴',88));
    at(lineStart(2), ()=>op.querySelector('.op-chart').classList.add('show'));
    at(lineStart(3)+.3, ()=>grow('🌳',130));
    at(lineStart(3)+2, ()=>op.classList.add('fruit'));
    at(SONG_END, ()=>{ cap.classList.remove('show'); op.classList.add('final'); });
    at(SONG_END+1.6, ()=>op.querySelector('#opStart').classList.add('show'));
  };
  op.querySelector('#opStart').onclick=close;
  const sk=op.querySelector('#opSkip'); if(sk) sk.onclick=close;
  op.querySelector('#opPlay').onclick=()=>run(true);
  op.querySelector('#opMute').onclick=()=>run(false);
  if(opts.autoRun) run(!!opts.sound);
}

// 動画づくり用：うたを WAV に して base64 で かえす
async function renderSongWav(opt={}){
  const sr=44100, ctx=new OfflineAudioContext(2, Math.ceil(sr*SONG_LEN), sr);
  scheduleSong(ctx, 0, opt);
  const buf=await ctx.startRendering();
  const n=buf.length, ch=[buf.getChannelData(0),buf.getChannelData(1)];
  const dv=new DataView(new ArrayBuffer(44+n*4));
  const w=(o,s)=>[...s].forEach((c,i)=>dv.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF'); dv.setUint32(4,36+n*4,true); w(8,'WAVE'); w(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,2,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr*4,true); dv.setUint16(32,4,true); dv.setUint16(34,16,true); w(36,'data'); dv.setUint32(40,n*4,true);
  for(let i=0;i<n;i++) for(let c=0;c<2;c++){ const v=Math.max(-1,Math.min(1,ch[c][i])); dv.setInt16(44+(i*2+c)*2, v*32767, true); }
  const bytes=new Uint8Array(dv.buffer); let s=''; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(s);
}

(function(){
  const q=new URLSearchParams(location.search);
  let seen=false; try{ seen=sessionStorage.getItem('op_seen')==='1'; }catch(e){}
  if(q.has('rec')) playOpening({noSkip:true, autoRun:true, sound:false, wait3d:15000});
  else if(q.has('op') || !seen) playOpening();
})();
</script>
